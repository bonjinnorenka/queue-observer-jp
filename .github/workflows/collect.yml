name: collect

on:
  schedule:
    # 主トリガーは Cloudflare Worker (cron-trigger/) からの workflow_dispatch(10分ごと、:05開始)。
    # GitHubのscheduleは遅延・スキップが多いため、Worker障害時の保険として1時間1回だけ残す。
    # 速度計算には予定時刻ではなく observed_at(実取得時刻)を使う。
    - cron: '50 * * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - '.github/workflows/collect.yml'

# Worker側で進行中runをチェックするため、concurrency制御は削除。
# 過去のcancel-in-progressによる10分キャンセル問題を回避。

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      data-changed: ${{ steps.check-data.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run tests
        run: node --test "test/*.test.js"

      - name: Collect snapshot
        if: github.event_name != 'push'
        run: node src/collect.js

      - name: Rebuild derived data
        if: github.event_name == 'push'
        run: node src/rebuild.js

      - name: Check data changes
        id: check-data
        run: |
          set -euo pipefail
          git add data
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'no data changes'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit data
        if: steps.check-data.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "observe: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M %Z')"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}), rebasing on remote"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          echo 'failed to push data changes' >&2
          exit 1

      - name: Build site
        if: steps.check-data.outputs.changed == 'true'
        run: node src/build-site.js

      - uses: actions/configure-pages@v6
        if: steps.check-data.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.check-data.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: observe
    if: needs.observe.outputs.data-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
